# 知叶桌面端打包配置（electron-builder）
# 产物输出到 release/（见 .gitignore）；渲染层与主进程全部由 electron-vite 打包到 out/，
# 主进程零第三方依赖，故无需携带 node_modules。
appId: com.xiaoye.desktop
productName: 知叶
directories:
  output: release
  buildResources: build
files:
  - out/**
asar: true
# 发布产物用 ASCII 文件名：中文产物名会在 GitHub Releases 上传时
# 触发 Node http 客户端「Request path contains unescaped characters」
artifactName: zhiye-${version}-${arch}.${ext}
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
    - target: dir
      arch:
        - arm64
# 发布目标（CI release.yml 传 --publish always 时上传产物；本地 dist 默认不发布）
publish:
  provider: github
  owner: zhangzhengyang27
  repo: zhiye
